[package]
name = "hft-arbitrage-bot"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "High-Frequency Trading Arbitrage Bot in Rust"
license = "MIT"

[dependencies]
# Async runtime
tokio = { version = "1.0", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Decimal arithmetic for precise financial calculations
rust_decimal = "1.32"
rust_decimal_macros = "1.32"

# Time handling
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.0", features = ["v4", "serde"] }

# WebSocket client
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
futures-util = "0.3"

# HTTP client
reqwest = { version = "0.11", features = ["json", "stream"] }
url = "2.5"

# EVM and blockchain (ethers-rs v2)
ethers-core = { version = "2.0" }
ethers-providers = { version = "2.0", default-features = false, features = ["rustls", "ws"] }
ethers-contract = { version = "2.0", features = ["abigen"] }
ethers-signers = { version = "2.0" }
ethers-middleware = { version = "2.0" }

# Cryptography
sha2 = "0.10"
hex = "0.4"
base64 = "0.21"
hmac = "0.12"
aes-gcm = "0.10"
zstd = "0.12"
zeroize = "1.7"
pbkdf2 = "0.12"

# Concurrent data structures
dashmap = "5.5"
crossbeam-channel = "0.5"

# Rate limiting
governor = "0.6"

# Metrics and monitoring
prometheus = "0.13"
lazy_static = "1.4"
axum = "0.7"

# ONNX Runtime for ML inference
ort = "1.16"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Async traits
async-trait = "0.1"

# Environment variables
dotenvy = "0.15"

# Performance optimization
mimalloc = { version = "0.1", default-features = false }

# Database
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid"] }
redis = { version = "0.24", features = ["tokio-comp"] }

# Machine Learning
ndarray = "0.15"
rand = "0.8"
rand_distr = "0.4"
fastrand = "2.0"

# System information
num_cpus = "1.0"
sysinfo = "0.30"

# Backtesting
csv = "1.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true