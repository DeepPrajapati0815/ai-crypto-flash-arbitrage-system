global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'flash-arb-monitor'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'flash-arb-bot'
    static_configs:
      - targets: ['flash-arb-bot:9091']
    scrape_interval: 5s
    metrics_path: '/metrics'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']

