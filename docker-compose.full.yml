# =============================================================================
# Docker Compose - COMPLETE DEPLOYMENT
# =============================================================================
# Full stack: Bot + Databases + Monitoring + ML Training
# 
# Usage: docker compose -f docker-compose.full.yml up -d --build
# =============================================================================

services:
  # ===========================================================================
  # PostgreSQL Database
  # ===========================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hft-postgres-full
    restart: unless-stopped
    
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-hft_bot}
      - POSTGRES_USER=${POSTGRES_USER:-hftbot}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hftbot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    
    networks:
      - hft-network

  # ===========================================================================
  # Redis Cache
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: hft-redis-full
    restart: unless-stopped
    
    command: redis-server --appendonly yes --maxmemory 2gb
    
    ports:
      - "${REDIS_PORT:-6379}:6379"
    
    volumes:
      - redis_data:/data
    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    
    networks:
      - hft-network

  # ===========================================================================
  # ML Training Service (Trains models, exports to ONNX)
  # ===========================================================================
  ml-trainer:
    build:
      context: ./ml_training
      dockerfile: Dockerfile
    container_name: hft-ml-trainer
    
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hftbot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hft_bot}
      - REDIS_URL=redis://redis:6379
      - PYTHONUNBUFFERED=1
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    
    volumes:
      - ./ml_training/models:/ml/models
      - ./ml_training/data:/ml/data
      - ./ml_training/scripts:/ml/scripts
    
    command: >
      sh -c "
        echo '🤖 Training ML models...' &&
        python scripts/train_xgboost_model.py &&
        echo '✅ ML model training complete!' &&
        echo '📦 ONNX model available at: ml_training/models/trading_model.onnx'
      "
    
    networks:
      - hft-network

  # ===========================================================================
  # HFT Arbitrage Bot - Main Application
  # ===========================================================================
  hft-bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hft-arbitrage-bot-full
    restart: unless-stopped
    
    environment:
      # App config
      - RUST_LOG=${RUST_LOG:-info}
      - RUST_BACKTRACE=1
      
      # Database connections
      - DATABASE_URL=postgresql://${POSTGRES_USER:-hftbot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-hft_bot}
      - REDIS_URL=redis://redis:6379
      
      # Monitoring
      - METRICS_PORT=${METRICS_PORT:-8080}
      - LOG_LEVEL=${RUST_LOG:-info}
      - ENABLE_TRACING=true
      
      # Performance
      - MAX_CONCURRENT_ORDERS=${MAX_CONCURRENT_ORDERS:-100}
      - LATENCY_TARGET_US=${LATENCY_TARGET_US:-1000}
      
      # Exchange APIs
      - BINANCE_API_KEY=${BINANCE_API_KEY:-}
      - BINANCE_SECRET_KEY=${BINANCE_SECRET_KEY:-}
      - OKX_API_KEY=${OKX_API_KEY:-}
      - OKX_SECRET_KEY=${OKX_SECRET_KEY:-}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE:-}
      
      # Blockchain
      - EVM_RPC_URL=${EVM_RPC_URL:-https://eth.llamarpc.com}
      - EVM_CHAIN_ID=${EVM_CHAIN_ID:-1}
      - EVM_PRIVATE_KEY=${EVM_PRIVATE_KEY:-}
      - FLASH_ARB_ADDRESS=${FLASH_ARB_ADDRESS:-}
      
      # MEV
      - USE_MEV_FIRST=${USE_MEV_FIRST:-false}
      - FLASHBOTS_SIGNING_KEY=${FLASHBOTS_SIGNING_KEY:-}
    
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-trainer:
        condition: service_completed_successfully
    
    ports:
      - "${METRICS_PORT:-8080}:8080"
    
    volumes:
      - ./logs:/app/logs
      - ./ml_training/models:/app/ml_training/models:ro
    
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    networks:
      - hft-network

  # ===========================================================================
  # Prometheus - Metrics Collection
  # ===========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: hft-prometheus-full
    restart: unless-stopped
    
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
    
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    
    depends_on:
      hft-bot:
        condition: service_healthy
    
    networks:
      - hft-network

  # ===========================================================================
  # Grafana - Dashboards & Visualization
  # ===========================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: hft-grafana-full
    restart: unless-stopped
    
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
    
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    
    depends_on:
      - prometheus
    
    networks:
      - hft-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  hft-network:
    driver: bridge

